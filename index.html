    const v = VIEWS[A.view] || VIEWS.home;
    root().innerHTML = banners() + v(A.arg);
    const f = root().querySelector('[autofocus]'); if (f) f.focus();
    window.scrollTo(0, 0);
  }
  function applyTheme() {
    const t = A.settings.theme;
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }
  function banners() {
    let h = '';
    if (A.bank.errors.length) h += `<div class="banner warn" role="alert"><strong>יש ערכים פגומים במאגר המילים (${A.bank.errors.length}).</strong> הם לא נטענו. <details><summary>פרטים</summary><ul>${A.bank.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></details></div>`;
    if (!A.storage.ok) h += `<div class="banner error" role="alert"><strong>השמירה נכשלה.</strong> ${esc(A.storage.error || '')} כדי לא לאבד התקדמות, ייצא קובץ גיבוי עכשיו. <button class="btn small" data-act="export">ייצוא גיבוי</button> <button class="btn small ghost" data-act="retry-save">נסה לשמור שוב</button></div>`;
    if (A.flash) { h += `<div class="banner ${A.flash.kind}" role="status">${esc(A.flash.text)} <button class="link" data-act="dismiss">סגור</button></div>`; }
    if (A.view === 'home' && backupDue()) h += `<div class="banner info">עברו ${A.settings.backupReminderDays}+ ימים מאז הגיבוי האחרון. הנתונים שמורים רק בדפדפן הזה. <button class="btn small" data-act="export">ייצוא גיבוי</button> <button class="link" data-act="snooze-backup">לא עכשיו</button></div>`;
    return h;
  }
  function backupDue() {
    const d = A.settings.backupReminderDays; if (!d || !A.events.length) return false;
    const since = Math.max(A.meta.lastExport || 0, A.meta.snoozeUntil || 0, A.events[0].t);
    return now() - since > d * C.DAY;
  }
  function header(title, back = true) {
    return `<header class="top">${back ? '<button class="icon-btn back" data-act="go" data-view="home" aria-label="חזרה למסך הראשי" title="חזרה">→</button>' : ''}<h1>${esc(title)}</h1></header>`;
  }
  const lvl = l => `<span class="lvl l${l}">רמה ${l}</span>`;
  const pctNum = th => Math.round(th);

  /* ----- Home ----- */
  function counts() {
    const c = { new: 0, seen: 0, learning: 0, mastered: 0, due: 0 }, t = now();
    for (const w of A.bank.words) {
      const ws = A.state.words[w.id], st = C.statusOf(ws);
      c[st]++;
      if (ws && ws.exposures && C.wordDue(ws) <= t) c.due++;
    }
    return c;
  }
  function brandHeader() {
    return `<header class="brand"><div class="brand-text"><h1>אוצר מילים באנגלית</h1><p>תרגול לקראת בחינת אמירנט</p></div>
      <nav class="brand-nav"><button class="icon-btn light" data-act="go" data-view="help" aria-label="איך זה עובד" title="איך זה עובד">?</button><button class="icon-btn light" data-act="go" data-view="settings" aria-label="הגדרות ונתונים" title="הגדרות ונתונים">⚙</button></nav></header>`;
  }
  function homeView() {
    const c = counts(), st = A.state, total = A.bank.words.length;
    let h = brandHeader();
    if (st.theta === null) {
      const n = C.placementLength(total);
      h += `<section class="card hero start"><div class="hero-icon" aria-hidden="true">🎯</div><h2>נתחיל במבחן קצר</h2><p class="muted">${n} שאלות, כדי להתאים את המילים לרמה שלך</p>
      ${A.session && A.session.kind === 'placement' ? `<button class="btn primary big" data-act="placement-resume">המשך את המבחן (${A.session.asked.length}/${n})</button>` : `<button class="btn primary big" data-act="placement-start" autofocus>התחל</button>`}
      <button class="link" data-act="placement-skip">דלג על המבחן</button></section>`;
      return h;
    }
    const ses = A.session && A.session.kind === 'practice' ? A.session : null;
    h += `<section class="card hero"><div class="hero-row">${ring(st.theta)}<div class="hero-main">
        <div class="eyebrow">ההתקדמות שלי</div>${trendChip()}
        <div class="focus">מילים חדשות מ${focusText(st.theta)}</div>
        ${ses ? `<button class="btn primary big" data-act="practice-resume" autofocus>המשך תרגול · ${Math.min(ses.idx + 1, ses.items.length)}/${ses.items.length}</button><button class="link" data-act="practice-abandon">סיים מפגש</button>`
        : `<button class="btn primary big" data-act="practice-start" autofocus>${c.due ? `תרגול · ${c.due} לחזרה` : 'התחל תרגול'}</button>`}
      </div></div></section>`;
    h += `<section class="grid stats">
      ${stat('בשליטה', c.mastered, 'mastered', '★', 'נענו נכון לאורך זמן, בזיהוי ובשליפה')}
      ${stat('בלמידה', c.seen + c.learning, 'progress', '↻', `${c.learning} נענו נכון לפחות פעם אחת, ${c.seen} נחשפו בלבד`)}
      ${stat('לחזרה', c.due, 'due', '⏰', 'מועד החזרה שלהן הגיע')}
      ${stat('חדשות', c.new, 'new', '✦', `מתוך ${total} במאגר`)}
    </section>`;
    h += trendCard() + successCard();
    h += focusCard();
    h += `<section class="card"><h2>המילים שלי</h2><div class="chips">
      <button class="chip c-hard" data-act="go" data-view="words" data-arg="hard">מילים קשות</button>
      <button class="chip c-mastered" data-act="go" data-view="words" data-arg="mastered">בשליטה</button>
      <button class="chip c-all" data-act="go" data-view="words" data-arg="all">כל המילים שנחשפו</button>
      <button class="chip c-bank" data-act="go" data-view="bank" data-arg="1">מאגר המילים לפי רמות</button></div></section>`;
    return h;
  }
  function focusCard() {
    const f = (A.meta && A.meta.focus) || {};
    const typeOpts = Object.entries(C.TYPES).map(([k, v]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('');
    const lvlOpts = [1, 2, 3, 4].map(l => `<option value="${l}" ${String(f.level) === String(l) ? 'selected' : ''}>רמה ${l}</option>`).join('');
    return `<section class="card focus-card"><h2>תרגול ממוקד</h2>
      <form class="focus-form" data-act="focus-start" novalidate>
        <label>סוג שאלה <select name="type"><option value="">כל הסוגים</option>${typeOpts}</select></label>
        <label>רמה <select name="level"><option value="">כל הרמות</option>${lvlOpts}</select></label>
        <button class="btn" type="submit">התחל</button>
      </form><p class="field-error" id="focus-err" role="alert"></p></section>`;
  }
  function stat(label, n, cls, icon, title) {
    return `<button class="stat st-${cls}" data-stat="${cls}" data-act="go" data-view="words" data-arg="${cls}" title="${esc(title)}"><div class="stat-icon" aria-hidden="true">${icon}</div><div class="num">${n}</div><div class="label">${esc(label)}</div></button>`;
  }
  function ring(theta) {
    const p = pctNum(theta), r = 50, c = 2 * Math.PI * r, off = c * (1 - p / 100);
    return `<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="התקדמות ${p}%" data-theta="${theta}">
      <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--brand-2)"/><stop offset="1" style="stop-color:var(--brand)"/></linearGradient></defs>
      <circle cx="60" cy="60" r="${r}" class="ring-bg"/>
      <circle cx="60" cy="60" r="${r}" class="ring-fg" stroke="url(#ringGrad)" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <text x="60" y="68" text-anchor="middle" class="ring-txt">${p}%</text></svg>`;
  }
  function focusText(theta) {
    const ls = Object.entries(C.levelMix(theta)).filter(e => e[1] > 0.1).map(e => e[0]);
    return ls.length > 1 ? `רמות ${ls.join('–')}` : `רמה ${ls[0] || 1}`;
  }
  function mixText(theta) {
    const ent = Object.entries(C.levelMix(theta)).filter(e => e[1] > 0.005);
    const pcts = ent.map(e => Math.round(e[1] * 100)); if (pcts.length === 2) pcts[1] = 100 - pcts[0];
    return ent.map(([l], i) => `רמה ${l} (${pcts[i]}%)`).join(' ו');
  }
  function trendChip() {
    const weekAgo = valueAt(now() - 7 * C.DAY);
    if (weekAgo === null) return '';
    const d = A.state.theta - weekAgo;
    return `<span class="trend ${d >= 0 ? 'up' : 'down'}" dir="ltr">${d >= 0 ? '▲ +' : '▼ '}${d.toFixed(1)}%</span> <span class="muted small">השבוע</span>`;
  }
  function trendCard() {
    const days = dailyHistory(30);
    if (days.length < 2) return '';
    return `<section class="card"><h2>מגמה</h2>${sparkline(days)}</section>`;
  }
  function dailyHistory(nDays) {
    const map = new Map();
    for (const h of A.state.history) { const d = new Date(h.t); map.set(d.toDateString(), { t: h.t, v: h.theta }); }
    return [...map.values()].filter(x => x.t > now() - nDays * C.DAY);
  }
  function valueAt(t) {
    let v = null; for (const h of A.state.history) { if (h.t <= t) v = h.theta; else break; }
    return v;
  }
  function sparkline(pts) {
    const W = 320, H = 80, vs = pts.map(p => p.v), lo = Math.max(0, Math.min(...vs) - 3), hi = Math.min(100, Math.max(...vs) + 3);
    const x = i => (i / (pts.length - 1)) * (W - 12) + 6, y = v => H - 6 - ((v - lo) / (hi - lo || 1)) * (H - 14);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const area = `${d} L${x(pts.length - 1).toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z`;
    const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 4 : 9}" class="${i === pts.length - 1 ? 'dot-last' : 'dot-hit'}"><title>${fmtDate(p.t)}: ${Math.round(p.v)}%</title></circle>`).join('');
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="התקדמות יומית ב-30 הימים האחרונים" dir="ltr">
      <defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brand);stop-opacity:.25"/><stop offset="1" style="stop-color:var(--brand);stop-opacity:0"/></linearGradient></defs>
      <path d="${area}" fill="url(#sparkFill)"/><path d="${d}" fill="none" class="spark-line"/>${dots}</svg>
      <div class="spark-axis muted small"><span>${fmtDate(pts[0].t)}</span><span>${Math.round(pts[pts.length - 1].v)}%</span></div>`;
  }
  function successCard() {
    const rec = A.state.recent;
    if (!rec.length) return '';
    const ok = r => C.isRight(r.r);
    const sk = s => rec.filter(r => C.TYPES[r.q].skill === s);
    const recog = sk('recog'), recall = sk('recall');
    const rate = arr => arr.length ? Math.round(100 * arr.filter(ok).length / arr.length) : null;
    const bar = (label, v, n) => v === null ? '' : `<div class="bar-row" title="${esc(label)}: ${v}% מתוך ${n} תשובות"><span class="bar-label">${esc(label)}</span><span class="bar-track"><span class="bar-fill" style="width:${v}%"></span></span><span class="bar-val">${v}%</span></div>`;
    const types = Object.entries(A.state.typeTotals).filter(([, v]) => v.c + v.w >= 5)
      .map(([q, v]) => bar(C.TYPES[q].label, Math.round(100 * v.c / (v.c + v.w)), v.c + v.w)).join('');
    return `<section class="card"><div class="row between"><h2>הצלחה</h2><span class="big-pct">${rate(rec)}%</span></div>
      ${bar('זיהוי', rate(recog), recog.length)}${bar('שליפה', rate(recall), recall.length)}
      ${types ? `<details class="more"><summary>לפי סוג שאלה</summary>${types}</details>` : ''}</section>`;
  }

  /* ----- Question / feedback ----- */
  function promptHtml(q) {
    const w = A.bank.byId[q.w];
    const p = q.prompt;
    const tts = ttsBtn(w.word);
    if (p.kind === 'word') return `<div class="prompt-word">${en(w.word)} ${tts}<div class="pos">${esc(posHe(w))}</div></div>`;
    if (p.kind === 'he') return `<div class="prompt-he">${tx(w.he)}<div class="pos">${esc(posHe(w))}</div>${p.hint ? `<div class="hint">רמז: מתחילה ב-${en(p.hint.first)}, ${p.hint.len} אותיות</div>` : ''}</div>`;
    if (p.kind === 'sentence') return enBlock(p.hint ? esc(p.s).replace('___', `<span class="blank">${esc(p.hint.first)}${'_'.repeat(Math.max(2, p.hint.len - 1))}</span>`) : blankify(p.s), 'sentence');
    if (p.kind === 'restatement') return enBlock(esc(p.s), 'sentence');
    if (p.kind === 'passage') {
      const txt = esc(p.text).replace(new RegExp(`\\b(${p.hl})\\b`, 'i'), '<mark>$1</mark>');
      return enBlock(txt, 'passage') + enBlock(esc(p.q), 'passage-q');
    }
    return '';
  }
  function ttsBtn(text) {
    if (!A.settings.tts || !('speechSynthesis' in window)) return '';
    return `<button class="icon-btn speak" data-act="speak" data-text="${esc(text)}" aria-label="השמע הגייה" title="השמע הגייה">🔊</button>`;
  }
  /* ----- Hints: the word in the context of a sentence ----- */
  function wordRegex(w) { return new RegExp(`\\b(${w.word.replace(/e$/, '')}[a-z]*)\\b`, 'i'); }
  function hintFor(q) {
    const w = A.bank.byId[q.w], th = A.state.theta ?? C.PARAMS.defaultTheta;
    const hard = C.TYPES[q.type].skill === 'recall' || w.level >= 3 || C.itemDifficulty(w, q.type) >= th;
    if (!hard) return null;
    const re = wordRegex(w);
    const ex = w.examples.find(e => re.test(e.en)) || w.examples[0];
    if (q.type === 'mcMeaning' || q.type === 'typeHe') return enBlock(esc(ex.en).replace(re, '<mark>$1</mark>'), 'hint-sent');
    if (q.type === 'typeEn' || q.type === 'mcReverse') {
      const ex2 = w.examples.find((e, i) => re.test(e.en) && i > 0) || ex;
      return enBlock(esc(ex2.en).replace(re, m => `<span class="blank">${esc(m[0])}${'_'.repeat(Math.max(2, m.length - 1))}</span>`), 'hint-sent');
    }
    if (q.type === 'typeCloze') return `<div class="hint-sent">המשמעות: ${tx(w.he)}</div>`;
    return null;
  }
  function hintHtml(q) {
    const s = A.session; if (!s || s.kind !== 'practice') return '';
    const it = s.items[s.idx], hint = hintFor(q);
    if (!hint) return '';
    return it.hintUsed ? `<div class="hintbox"><span class="hint-label">💡 רמז</span>${hint}</div>` : `<button class="btn hint-btn" data-act="hint">💡 רמז</button>`;
  }
  function questionHtml(q, ctx) {
    const t = C.TYPES[q.type];
    const w = A.bank.byId[q.w];
    let h = `<div class="qmeta">${lvl(w.level)}<span class="qtype">${esc(t.label)}</span>${t.origin !== 'original' ? `<span class="tag amirnet">${t.origin === 'amirnet' ? 'בסגנון אמירנט' : 'בהשראת אמירנט'}</span>` : ''}${ctx.progress ? `<span class="qprog">${ctx.progress}</span>` : ''}</div>`;
    const hint = hintHtml(q);
    h += `<p class="instr">${esc(q.instr)}</p>${promptHtml(q)}${hint.startsWith('<div') ? hint : ''}`;
    if (q.options) {
      h += `<div class="options">${q.options.map((o, i) => `<button class="opt" data-act="answer-opt" data-i="${i}"><span class="key">${i + 1}</span>${o.lang === 'en' ? en(o.text) : `<span>${tx(o.text)}</span>`}</button>`).join('')}</div>`;
    } else {
      h += `<form class="typed" data-act="answer-typed"><input name="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${q.input === 'en' ? 'dir="ltr" lang="en" placeholder="type the word"' : 'dir="rtl" lang="he" placeholder="הקלד כאן"'} autofocus aria-label="תשובה">
        <button class="btn primary" type="submit">בדוק</button></form><p class="field-error" id="ferr" role="alert"></p>`;
    }
    h += `<div class="row"><button class="btn ghost" data-act="answer-dk">לא יודע</button>${hint.startsWith('<button') ? hint : ''}</div>`;
    return h;
  }
  function feedbackHtml(q, ans, opts = {}) {
    const w = A.bank.byId[q.w];
    const ok = C.isRight(ans.r);
    const correctText = q.options ? q.options.find(o => o.correct).text : (q.type === 'typeHe' ? w.he : q.target);
    const correctLang = q.options ? q.options.find(o => o.correct).lang : (q.type === 'typeHe' ? 'he' : 'en');
    const head = ans.r === R.CORRECT ? 'נכון!' : ans.r === R.HINT ? 'נכון, בעזרת רמז' : ans.r === R.SELF ? 'נרשם כנכון' : ans.r === R.DONT_KNOW ? 'המילה תחזור בקרוב' : 'לא נכון';
    let h = `<div class="fb ${ok ? 'ok' : 'bad'}" role="status"><span class="fb-icon" aria-hidden="true">${ok ? '✓' : ans.r === R.DONT_KNOW ? '?' : '✗'}</span><div><strong>${head}</strong>`;
    if (ans.note) h += `<div class="small">${esc(ans.note)}</div>`;
    if (ans.given && !ok) h += `<div class="small">התשובה שלך: ${ans.givenLang === 'en' ? en(ans.given) : esc(ans.given)}</div>`;
    h += `</div></div>`;
    if (q.options) {
      h += `<div class="options answered">${q.options.map((o, i) => `<div class="opt ${o.correct ? 'right' : ''} ${ans.choice === i && !o.correct ? 'wrong' : ''}"><span class="key">${i + 1}</span>${o.lang === 'en' ? en(o.text) : `<span>${tx(o.text)}</span>`}</div>`).join('')}</div>`;
    } else {
      h += `<p>התשובה הנכונה: <strong>${correctLang === 'en' ? en(correctText) : tx(correctText)}</strong></p>`;
    }
    if (q.prompt.kind === 'sentence' && q.options) {
      const right = q.options.find(o => o.correct).text;
      h += enBlock(esc(q.prompt.s).replace('___', `<strong>${esc(right)}</strong>`), 'sentence small');
    }
    h += `<div class="explain"><p><strong>הסבר:</strong> ${tx(q.why || w.usage)}</p>`;
    if (!ok) {
      const conf = (w.confusables || [])[0], trap = (w.traps || [])[0];
      if (conf && !['distinction'].includes(q.type)) h += `<p><strong>להבחנה:</strong> ${en(conf.word)} = ${tx(conf.he)}. ${tx(conf.note)}</p>`;
      else if (trap) h += `<p><strong>שים לב:</strong> ${tx(trap)}</p>`;
    }
    h += `</div>`;
    h += miniCard(w);
    h += `<div class="row">${opts.allowSelf ? '<button class="btn ghost" data-act="self-correct">צדקתי (התשובה שלי נכונה)</button>' : ''}<button class="btn primary" data-act="next" autofocus>המשך</button></div>`;
    return h;
  }
  function miniCard(w) {
    const ex = w.examples[0];
    return `<div class="mini"><div class="row between"><div>${en(w.word)} ${ttsBtn(w.word)} <span class="muted small">${esc(posHe(w))}</span> ${lvl(w.level)}</div><button class="link" data-act="go" data-view="word" data-arg="${w.id}" data-from="${A.view}">כרטיס מלא</button></div>
      <div>${tx(w.he)}</div>${enBlock(esc(ex.en), 'small')}<div class="small muted">${tx(ex.he)}</div></div>`;
  }

  /* ----- Placement ----- */
  function placementView() {
    const s = A.session; const total = C.placementLength(A.bank.words.length);
    if (!s || s.kind !== 'placement') return homeView();
    if (s.result) return placementResult(s.result);
    const q = s.current.qdata;
    const done = s.asked.length;
    const prog = `${done + (s.phase === 'feedback' ? 0 : 1)}/${total}`;
    return header('מבחן פתיחה') + progressBar(done / total) + `<section class="card qcard">${s.phase === 'feedback' ? feedbackHtml(q, s.lastAnswer) : questionHtml(q, { progress: prog })}</section>`;
  }
  function progressBar(f) { return `<div class="progress" aria-hidden="true"><div style="width:${Math.round(100 * f)}%"></div></div>`; }
  function placementResult(res) {
    const tip = res.theta < 35 ? 'מפגשים קצרים, עם דגש על זיהוי משמעות.' : res.theta < 65 ? 'מפגש יומי, עם דגש על השלמת משפטים.' : 'דגש על המילים הקשות ועל ניסוח מחדש.';
    return header('התוצאה שלך') + `<section class="card hero result">${ring(res.theta)}
      <h2>נקודת ההתחלה שלך: ${pctNum(res.theta)}%</h2>
      <p>${res.correct} תשובות נכונות מתוך ${res.n}. נתחיל ממילים ב${mixText(res.theta)}.</p>
      <p class="tip">💡 ${tip}</p>
      <button class="btn primary big" data-act="placement-done" autofocus>בוא נתחיל</button></section>`;
  }
  function placementStart() {
    A.session = { kind: 'placement', id: 'p' + now(), asked: [], current: null, phase: 'question' };
    placementNext();
  }
  function placementNext() {
    const s = A.session, rng = C.mulberry32(seedOf(s.id + s.asked.length));
    const it = C.nextPlacementItem(A.bank.words, s.asked, rng);
    if (!it) return placementFinish();
    it.seed = s.id;
    s.current = { ...it, qdata: makeQuestion(it) }; s.phase = 'question';
    saveSession(); go('placement');
  }
  function placementFinish() {
    const s = A.session;
    const theta = C.placementEstimate(s.asked);
    const correct = s.asked.filter(a => a.r === R.CORRECT).length;
    logEvent({ id: C.uid(now(), Math.random), t: now(), k: 'placement', theta, n: s.asked.length });
    s.result = { theta, n: s.asked.length, correct };
    saveSession(); go('placement');
  }

  /* ----- Practice ----- */
  function practiceView() {
    const s = A.session;
    if (!s || s.kind !== 'practice') return homeView();
    if (s.idx >= s.items.length) return summaryView(s);
    const it = s.items[s.idx];
    if (!it.qdata) { it.qdata = makeQuestion(it); saveSession(); }
    const prog = `${s.idx + 1}/${s.items.length}`;
    return header(s.focus ? 'תרגול ממוקד' : 'תרגול') + (s.focus ? `<p class="focus-tag">${esc(focusLabel(s.focus))}</p>` : '') + progressBar(s.idx / s.items.length) + `<section class="card qcard">${s.phase === 'feedback' ? feedbackHtml(it.qdata, s.lastAnswer, { allowSelf: s.lastAnswer.allowSelf }) : questionHtml(it.qdata, { progress: prog })}</section>`;
  }
  function practiceStart(focus = null) {
    const t = now(), id = 's' + t;
    const rng = C.mulberry32(seedOf(id));
    const items = focus ? C.buildFocusedSession(A.bank.words, A.state, A.settings, t, rng, focus) : C.buildSession(A.bank.words, A.state, A.settings, t, rng);
    if (!items.length) { A.flash = { kind: 'info', text: focus ? 'אין מילים שמתאימות לבחירה הזאת.' : 'אין כרגע מילים לתרגול.' }; return render(); }
    items.forEach((it, i) => { it.seed = id + ':' + i; });
    A.session = { kind: 'practice', id, startedAt: t, items, idx: 0, phase: 'question', reasked: [], thetaStart: A.state.theta, results: [], focus: focus || null };
    saveSession(); go('practice');
  }
  function focusLabel(f) {
    if (!f) return '';
    return [f.type && C.TYPES[f.type] ? C.TYPES[f.type].label : '', f.level ? 'רמה ' + f.level : ''].filter(Boolean).join(' · ');
  }
  function summaryView(s) {
    const n = s.results.length, ok = s.results.filter(C.isRight).length;
    const d = A.state.theta - s.thetaStart;
    const tomorrow = A.bank.words.filter(w => { const ws = A.state.words[w.id]; return ws && ws.exposures && C.wordDue(ws) <= now() + C.DAY; }).length;
    return header('כל הכבוד!') + `<section class="card hero result"><div class="hero-icon" aria-hidden="true">🎉</div>
      <div class="sum-grid"><div><div class="num">${n}</div><div class="label">שאלות</div></div><div><div class="num">${pct(ok, n)}</div><div class="label">נכונות</div></div><div><div class="num" dir="ltr">${d >= 0 ? '+' : ''}${d.toFixed(1)}%</div><div class="label">התקדמות</div></div></div>
      <p class="muted">${tomorrow} מילים יחכו לחזרה עד מחר.</p>
      <div class="row center"><button class="btn primary" data-act="practice-finish" autofocus>למסך הראשי</button><button class="btn" data-act="practice-again">עוד מפגש</button></div></section>`;
  }

  /* ----- Answer handling (shared) ----- */
  function currentQ() {
    const s = A.session;
    if (!s) return null;
    if (s.kind === 'placement') return s.current && s.current.qdata;
    return s.items[s.idx] && s.items[s.idx].qdata;
  }
  function submitAnswer(ans) {
    const s = A.session, q = currentQ(); if (!q || s.phase !== 'question') return;
    const t = now();
    if (s.kind === 'placement') {
      const ev = { id: C.uid(t, Math.random), t, w: q.w, q: q.type, r: ans.r, m: 'p', f: false };
      logEvent(ev);
      s.asked.push({ w: q.w, q: q.type, level: s.current.level, b: s.current.b, r: ans.r });
      s.lastAnswer = ans; s.phase = 'feedback';
      saveSession(); return render();
    }
    const it = s.items[s.idx];
    if (it.hintUsed && ans.r === R.CORRECT) ans.r = R.HINT;
    const ev = { id: C.uid(t, Math.random), t, w: q.w, q: q.type, r: ans.r, m: 's', f: !it.repeat, sid: s.id };
    logEvent(ev);
    ans.eventId = ev.id;
    ans.allowSelf = q.type === 'typeHe' && ans.r === R.WRONG;
    s.results.push(ans.r);
    const laterSame = s.items.slice(s.idx + 1).some(x => x.w === q.w);
    if (!C.isRight(ans.r) && !s.reasked.includes(q.w) && !laterSame) {
      const word = A.bank.byId[q.w];
      const re = C.reaskItem(word, A.state.words[q.w], q.type, A.state.theta, C.mulberry32(seedOf(s.id + 're' + s.idx)));
      re.seed = s.id + ':re:' + s.idx;
      const pos = Math.min(s.idx + 1 + C.PARAMS.reaskGap, s.items.length);
      s.items.splice(pos, 0, re); s.reasked.push(q.w); ans.reaskAt = pos;
    }
    s.lastAnswer = ans; s.phase = 'feedback';
    saveSession(); render();
  }
  function selfCorrect() {
    const s = A.session, ans = s && s.lastAnswer; if (!ans || !ans.allowSelf) return;
    const ev = A.events.find(e => e.id === ans.eventId); if (!ev) return;
    ev.r = R.SELF; recompute(); saveProgress();
    if (ans.reaskAt !== undefined) { s.items.splice(ans.reaskAt, 1); s.reasked = s.reasked.filter(w => w !== ev.w); delete ans.reaskAt; }
    s.results[s.results.length - 1] = R.SELF;
    ans.r = R.SELF; ans.allowSelf = false; ans.note = 'נרשם כתשובה נכונה בהערכה עצמית. היא נספרת חלקית בסקאלה ואינה מקדמת את המילה לחזרה רחוקה.';
    saveSession(); render();
  }
  function next() {
    const s = A.session; if (!s) return go('home');
    if (s.kind === 'placement') { s.lastAnswer = null; return placementNext(); }
    s.idx++; s.phase = 'question'; s.lastAnswer = null;
    saveSession(); render();
  }
  function onOption(i) {
    const q = currentQ(); if (!q || !q.options || !q.options[i]) return;
    const o = q.options[i];
    submitAnswer({ r: o.correct ? R.CORRECT : R.WRONG, choice: i });
  }
  function onTyped(val) {
    const q = currentQ(); if (!q) return;
    const ferr = document.getElementById('ferr');
    if (!val.trim()) { if (ferr) ferr.textContent = 'יש להקליד תשובה, או לבחור "לא יודע".'; return; }
    const w = A.bank.byId[q.w];
    if (q.input === 'he') {
      if (/[a-zA-Z]/.test(val) && !/[א-ת]/.test(val)) { if (ferr) ferr.textContent = 'כאן נדרשת תשובה בעברית.'; return; }
      const res = C.checkHebrew(val, w.accept);
      submitAnswer({ r: res.ok ? R.CORRECT : R.WRONG, given: val, givenLang: 'he', note: res.typo ? 'נחשב נכון למרות טעות הקלדה קטנה.' : '' });
    } else {
      if (/[א-ת]/.test(val)) { if (ferr) ferr.textContent = 'כאן נדרשת תשובה באנגלית.'; return; }
      const res = C.checkEnglish(val, q.target, w.word);
      submitAnswer({ r: res.ok ? R.CORRECT : R.WRONG, given: val, givenLang: 'en', note: res.typo ? `נחשב נכון; שים לב לאיות: ${q.target}` : res.form ? `נחשב נכון; במשפט הזה הצורה הנכונה היא ${q.target}.` : '' });
    }
  }

  /* ----- Words ----- */
  function wordRow(w, ws, from) {
    const st = C.statusOf(ws);
    const extra = ws && ws.exposures ? `<span class="muted small">${pct(ws.correct + ws.self, ws.exposures)} הצלחה</span>` : '';
    return `<li><button class="wrow" data-act="go" data-view="word" data-arg="${w.id}" data-from="${from}">
        <span class="w">${en(w.word)}</span><span class="he">${tx(w.he)}</span><span class="badge ${st}">${STATUS_HE[st]}</span><span class="meta">${lvl(w.level)} ${extra}</span></button></li>`;
  }
  function wordsView(filter = 'all') {
    const t = now();
    const all = A.bank.words.map(w => ({ w, ws: A.state.words[w.id] }));
    const list = all.filter(x => x.ws && x.ws.exposures);
    const byWord = (a, b) => a.w.word.localeCompare(b.w.word);
    const F = {
      mastered: () => list.filter(x => C.isMastered(x.ws)).sort(byWord),
      progress: () => list.filter(x => !C.isMastered(x.ws)).sort(byWord),
      due: () => list.filter(x => C.wordDue(x.ws) <= t).sort((a, b) => C.wordDue(a.ws) - C.wordDue(b.ws)),
      new: () => all.filter(x => !x.ws || !x.ws.exposures).sort((a, b) => (a.w.level - b.w.level) || byWord(a, b)),
      hard: () => list.filter(x => C.isHard(x.ws)).sort((a, b) => C.mastery(a.ws) - C.mastery(b.ws)),
      all: () => list.slice().sort(byWord),
    };
    if (!F[filter]) filter = 'all';
    const rows = F[filter]();
    const tab = (k, l) => `<button class="tab ${filter === k ? 'on' : ''}" data-act="go" data-view="words" data-arg="${k}" aria-pressed="${filter === k}">${l}</button>`;
    const empty = { hard: 'אין כרגע מילים קשות.', mastered: 'עדיין אין מילים בשליטה. מילה נחשבת בשליטה אחרי כמה תשובות נכונות במרווחי זמן הולכים וגדלים, גם בזיהוי וגם בשליפה.', all: 'עדיין לא נחשפת למילים.', progress: 'אין כרגע מילים בלמידה.', due: 'אין כרגע מילים שמחכות לחזרה.', new: 'נחשפת לכל המילים במאגר.' };
    return header('המילים שלי') + `<div class="tabs" role="group">${tab('mastered', 'בשליטה')}${tab('progress', 'בלמידה')}${tab('due', 'לחזרה')}${tab('new', 'חדשות')}${tab('hard', 'קשות')}${tab('all', 'כל שנחשפו')}</div>
      <section class="card"><p class="muted small list-count">${rows.length} מילים</p>${rows.length ? `<ul class="wlist">${rows.map(({ w, ws }) => wordRow(w, ws, 'words:' + filter)).join('')}</ul>` : `<p class="muted">${empty[filter]}</p>`}</section>`;
  }
  function bankView(level = '1') {
    const L = ['1', '2', '3', '4'].includes(String(level)) ? Number(level) : 1;
    const rows = A.bank.words.filter(w => w.level === L).slice().sort((a, b) => a.word.localeCompare(b.word));
    const n = l => A.bank.words.filter(w => w.level === l).length;
    const tab = l => `<button class="tab ${L === l ? 'on' : ''}" data-act="go" data-view="bank" data-arg="${l}" aria-pressed="${L === l}">רמה ${l} <span class="tab-n">${n(l)}</span></button>`;
    return header('מאגר המילים') + `<div class="tabs" role="group">${[1, 2, 3, 4].map(tab).join('')}</div>
      <section class="card"><p class="muted small list-count">${rows.length} מילים ברמה ${L}</p><ul class="wlist">${rows.map(w => wordRow(w, A.state.words[w.id], 'bank:' + L)).join('')}</ul></section>`;
  }
  function wordView(id) {
    const w = A.bank.byId[id]; if (!w) return homeView();
    const ws = A.state.words[id];
    const list = (title, arr) => arr && arr.length ? `<h3>${title}</h3><ul>${arr.join('')}</ul>` : '';
    const back = A.from ? `<button class="btn ghost small" data-act="back">→ חזרה</button>` : '';
    const hard = ws ? Object.entries(ws.types).filter(([, v]) => v.w > 0).map(([q, v]) => `${C.TYPES[q].label} (${v.w} שגיאות)`) : [];
    return `<header class="top">${back}<button class="btn ghost small" data-act="go" data-view="home">ראשי</button></header>
    <section class="card word-card">
      <div class="row between"><h1 class="wtitle">${en(w.word)} ${ttsBtn(w.word)}</h1>${lvl(w.level)}</div>
      <p class="pos">${esc(posHe(w))}</p>
      <p class="tr">${tx(w.he)}</p>
      ${list('משמעויות', w.senses.map(s => `<li>${tx(s.he)}</li>`))}
      <h3>שימוש</h3><p>${tx(w.usage)}</p>
      ${list('דוגמאות', w.examples.map(e => `<li>${enBlock(esc(e.en))}<div class="muted">${tx(e.he)}</div></li>`))}
      ${list('צירופים נפוצים', w.collocations.map(c => `<li>${en(c)}</li>`))}
      ${list('מבנים', (w.patterns || []).map(c => `<li>${en(c)}</li>`))}
      ${w.structure ? `<h3>מבנה המילה</h3><p>${tx(w.structure)}</p>` : ''}
      ${list('משפחת המילה', (w.family || []).map(f => `<li>${en(f.word)} <span class="muted">(${esc(POS_HE[f.pos] || f.pos)})</span> · ${tx(f.he)}</li>`))}
      ${w.synonyms ? `<h3>נרדפות</h3><p>${en(w.synonyms.join(', '))}</p>` : ''}
      ${w.antonyms ? `<h3>ניגודים</h3><p>${en(w.antonyms.join(', '))}</p>` : ''}
      ${list('מילים מבלבלות', (w.confusables || []).map(c => `<li>${en(c.word)} · ${tx(c.he)}. ${tx(c.note)}</li>`))}
      ${list('מלכודות לדוברי עברית', (w.traps || []).map(t => `<li>${tx(t)}</li>`))}
      ${w.sources ? `<p class="muted small">מקור: ${esc(w.sources.join('; '))}</p>` : ''}
      ${w.flags ? `<p class="banner warn small">טעון אימות: ${esc(w.flags.join('; '))}</p>` : ''}
    </section>
    ${ws && ws.exposures ? `<section class="card"><h2>היסטוריית הלמידה</h2><table class="tbl"><tbody>
      <tr><td>מצב</td><td><span class="badge ${C.statusOf(ws)}">${STATUS_HE[C.statusOf(ws)]}</span></td></tr>
      <tr><td>חשיפות</td><td>${ws.exposures}</td></tr>
      <tr><td>נכונות / שגויות / לא ידעתי</td><td>${ws.correct + ws.self} / ${ws.wrong} / ${ws.dontKnow}</td></tr>
      <tr><td>הערכת שליטה</td><td>${Math.round(C.mastery(ws) * 100)}%</td></tr>
      <tr><td>תרגול אחרון</td><td>${fmtDate(ws.lastSeen)}</td></tr>
      <tr><td>חזרה מתוכננת</td><td>${C.wordDue(ws) <= now() ? 'עכשיו' : fmtDate(C.wordDue(ws))}</td></tr>
      <tr><td>שלב זיהוי / שליפה</td><td>${ws.recog.box} / ${ws.recall.due === null ? 'טרם נפתח' : ws.recall.box}</td></tr>
      ${hard.length ? `<tr><td>סוגי שאלות שבהם היה קושי</td><td>${esc(hard.join(', '))}</td></tr>` : ''}
    </tbody></table></section>` : ''}`;
  }

  /* ----- Settings & data ----- */
  function settingsView() {
    const s = A.settings, ip = A.importPreview;
    let used = 0; try { for (const k of Object.values(KEYS)) used += (localStorage.getItem(k) || '').length; } catch (e) { /* ignore */ }
    let h = header('הגדרות ונתונים');
    h += `<section class="card"><h2>הגדרות</h2><form data-act="save-settings" class="form" novalidate>
      <label>מספר שאלות במפגש <input type="number" name="sessionLength" min="5" max="40" value="${s.sessionLength}" dir="ltr"></label>
      <label>מקסימום מילים חדשות במפגש <input type="number" name="newPerSession" min="0" max="15" value="${s.newPerSession}" dir="ltr"></label>
      <label>תזכורת לגיבוי כל (ימים, 0 = כבוי) <input type="number" name="backupReminderDays" min="0" max="60" value="${s.backupReminderDays}" dir="ltr"></label>
      <label>מצב תצוגה <select name="theme"><option value="system" ${s.theme === 'system' ? 'selected' : ''}>לפי המערכת</option><option value="light" ${s.theme === 'light' ? 'selected' : ''}>בהיר</option><option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>כהה</option></select></label>
      <label class="check"><input type="checkbox" name="tts" ${s.tts ? 'checked' : ''}> כפתור הגייה ${'speechSynthesis' in window ? '' : '(לא נתמך בדפדפן הזה)'}</label>
      <p class="field-error" id="serr" role="alert"></p>
      <button class="btn primary" type="submit">שמור הגדרות</button></form></section>`;
    h += `<section class="card"><h2>ייצוא</h2><p class="small">הקובץ כולל את כל היסטוריית התרגול, מועדי החזרה, הערכות השליטה, הסקאלה וההגדרות. ${A.meta.lastExport ? `ייצוא אחרון: ${fmtDate(A.meta.lastExport)}.` : 'עדיין לא בוצע ייצוא.'}</p>
      <div class="row wrap"><button class="btn primary" data-act="export">הורד קובץ גיבוי (JSON)</button><button class="btn" data-act="export-copy">העתק כטקסט</button></div></section>`;
    h += `<section class="card"><h2>ייבוא</h2><p class="small">טעינת קובץ גיבוי ממכשיר אחר. הקובץ ייבדק לפני שמשהו ישתנה.</p>
      <div class="row wrap"><label class="btn file-btn">בחר קובץ<input type="file" accept=".json,application/json" data-act="import-file" hidden></label></div>
      <details><summary>או הדבק טקסט</summary><textarea id="import-text" rows="4" dir="ltr" aria-label="טקסט לייבוא"></textarea><button class="btn" data-act="import-text">בדוק טקסט</button></details>
      ${ip ? importPreviewHtml(ip) : ''}
      ${hasBackup() ? `<p class="small">קיים עותק של המצב שלפני הייבוא האחרון. <button class="link" data-act="undo-import">שחזר אותו</button></p>` : ''}</section>`;
    h += `<section class="card"><h2>מבחן פתיחה</h2><p class="small">ביצוע חוזר של המבחן קובע אחוז התחלה חדש. היסטוריית המילים נשמרת.</p><button class="btn" data-act="placement-redo">בצע מבחן פתיחה מחדש</button></section>`;
    h += `<section class="card danger"><h2>איפוס</h2><p class="small">מחיקת כל ההתקדמות וההגדרות בדפדפן הזה. מומלץ לייצא גיבוי קודם.</p>
      ${A.confirmReset ? `<p><strong>למחוק את כל ההתקדמות? אי אפשר לבטל.</strong></p><div class="row"><button class="btn danger" data-act="reset-confirm">כן, מחק הכול</button><button class="btn" data-act="reset-cancel">ביטול</button></div>` : '<button class="btn danger" data-act="reset">איפוס כל הנתונים</button>'}</section>`;
    h += `<p class="muted small">מאגר: ${A.bank.words.length} מילים (גרסה ${esc(A.bank.version)}) · ${A.events.length} רשומות תרגול · נפח שמור: כ-${Math.ceil(used / 1024)}KB · גרסת סכמה ${C.SCHEMA_VERSION}</p>`;
    return h;
  }
  function hasBackup() { try { return !!localStorage.getItem(KEYS.backup); } catch (e) { return false; } }
  function importPreviewHtml(ip) {
    if (!ip.ok) return `<div class="banner error" role="alert"><strong>הייבוא נכשל. הנתונים הקיימים לא שונו.</strong><ul>${ip.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul><button class="link" data-act="import-clear">סגור</button></div>`;
    const inc = C.replay(ip.data.events, A.bank.byId);
    const answers = ip.data.events.filter(e => e.k !== 'placement').length;
    const last = ip.data.events.reduce((m, e) => Math.max(m, e.t), 0);
    const curAnswers = A.events.filter(e => e.k !== 'placement').length;
    const sameBank = !ip.data.bank || !ip.data.bank.id || ip.data.bank.id === A.bank.bankId;
    return `<div class="import-preview" role="region" aria-label="תצוגה מקדימה של הייבוא"><h3>הקובץ תקין</h3>
      ${ip.warnings.length ? `<ul class="warnlist">${ip.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      <table class="tbl"><thead><tr><th></th><th>בקובץ</th><th>בדפדפן הזה</th></tr></thead><tbody>
      <tr><td>תשובות</td><td>${answers}</td><td>${curAnswers}</td></tr>
      <tr><td>פעילות אחרונה</td><td>${fmtDate(last)}</td><td>${fmtDate(A.events.reduce((m, e) => Math.max(m, e.t), 0))}</td></tr>
      <tr><td>סקאלה</td><td>${inc.theta === null ? '—' : inc.theta.toFixed(1)}</td><td>${A.state.theta === null ? '—' : A.state.theta.toFixed(1)}</td></tr></tbody></table>
      ${A.events.length ? `<p class="small">בדפדפן הזה כבר יש התקדמות. בחר מה לעשות:</p>
        <div class="row wrap"><button class="btn danger" data-act="import-replace">החלף בנתוני הקובץ</button>
        ${sameBank ? '<button class="btn" data-act="import-merge">מזג (איחוד היסטוריות)</button>' : ''}
        <button class="btn ghost" data-act="import-clear">בטל ושמור את הקיים</button></div>
        <p class="muted small">מיזוג מאחד את רשומות התרגול משני המקורות לפי מזהה ייחודי של כל תשובה, ומחשב מחדש את כל המצב. הגדרות הדפדפן הזה נשמרות. לפני החלפה או מיזוג נשמר עותק של המצב הנוכחי, ואפשר לשחזר אותו.</p>`
        : `<div class="row"><button class="btn primary" data-act="import-replace">טען את הנתונים</button><button class="btn ghost" data-act="import-clear">ביטול</button></div>`}</div>`;
  }
  function doExport(copy) {
    const payload = C.exportPayload(A.events, A.settings, A.session, A.bank);
    const text = JSON.stringify(payload, null, 1);
    if (copy) {
      const done = () => { A.flash = { kind: 'ok', text: 'הנתונים הועתקו. שמור אותם במקום בטוח.' }; A.meta.lastExport = now(); saveMeta(); render(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => { A.flash = { kind: 'error', text: 'ההעתקה נכשלה. השתמש בהורדת קובץ.' }; render(); });
      else { A.flash = { kind: 'error', text: 'ההעתקה אינה נתמכת. השתמש בהורדת קובץ.' }; render(); }
      return;
    }
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(blob);
    a.download = `amirnet-progress-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    A.meta.lastExport = now(); saveMeta();
    A.flash = { kind: 'ok', text: 'קובץ הגיבוי הורד.' }; render();
  }
  function previewImport(text) {
    A.importPreview = C.validateImport(text, { now: now(), bankById: A.bank.byId, bankId: A.bank.bankId });
    render();
  }
  function applyImport(mode) {
    const ip = A.importPreview; if (!ip || !ip.ok) return;
    if (!Store.write(KEYS.backup, { at: now(), events: A.events, settings: A.settings, session: A.session })) {
      A.flash = { kind: 'error', text: 'לא ניתן היה לשמור עותק של המצב הנוכחי, ולכן הייבוא בוטל. ייצא גיבוי ונסה שוב.' };
      return render();
    }
    if (mode === 'merge') { A.events = C.mergeEvents(A.events, ip.data.events); A.session = null; }
    else { A.events = C.sortEvents(ip.data.events); A.settings = ip.data.settings; A.session = ip.data.session; }
    recompute(); saveProgress(); saveSettings(); saveSession();
    A.importPreview = null;
    A.flash = { kind: 'ok', text: mode === 'merge' ? 'המיזוג הושלם.' : 'הנתונים נטענו בהצלחה.' };
    go('home');
  }
  function undoImport() {
    const b = Store.read(KEYS.backup).value; if (!b) return;
    A.events = b.events || []; A.settings = C.sanitizeSettings(b.settings); A.session = b.session && C.validSession(b.session, A.bank.byId) ? b.session : null;
    recompute(); saveProgress(); saveSettings(); saveSession(); Store.remove(KEYS.backup);
    A.flash = { kind: 'ok', text: 'המצב שלפני הייבוא שוחזר.' }; go('home');
  }

  /* ----- Help ----- */
  function helpView() {
    const P = C.PARAMS;
    const card = (icon, cls, title, body) => `<section class="help-card ${cls}"><div class="help-icon" aria-hidden="true">${icon}</div><div><h2>${title}</h2>${body}</div></section>`;
    return header('איך זה עובד') + `<div class="help-grid">
      ${card('📈', 'h-brand', 'אחוז ההתקדמות', `<p>עולה בהדרגה עם תשובות נכונות ויורד עם טעויות. תשובה אחת לא מזיזה אותו ביותר מ-${P.maxStep}%.</p>`)}
      ${card('🧩', 'h-l2', 'אילו מילים יופיעו', '<p>מילים חדשות מגיעות משתי רמות סמוכות. ככל שהאחוז עולה, יותר מהן מהרמה הקשה.</p>')}
      ${card('🔁', 'h-l1', 'חזרות', `<p>מילה שענית עליה נכון חוזרת אחרי ${P.intervalsDays.slice(1, 6).join(', ')} ימים ויותר. מילה שטעית בה חוזרת במפגש הבא, וגם פעם נוספת באותו מפגש.</p>`)}
      ${card('✍️', 'h-l3', 'סוגי שאלות', `<p><strong>בחירה:</strong> משמעות, השלמת משפט, איות, מילים דומות, משפחות מילים.</p><p><strong>פתוחות:</strong> הקלדת המשמעות או המילה. הן מתחילות אחרי שזיהית מילה פעם אחת.</p><p><span class="tag amirnet">בסגנון אמירנט</span> השלמת משפטים וניסוח מחדש.</p>`)}
      ${card('💡', 'h-amber', 'טיפים', '<ul><li>אם אינך יודע, עדיף ללחוץ על "לא יודע" מאשר לנחש.</li><li>בשאלות קשות אפשר לקבל רמז: המילה בתוך משפט. תשובה נכונה עם רמז נספרת כחצי.</li><li>אם הקלדת תשובה נכונה שלא זוהתה, לחץ "צדקתי".</li><li>מקשים: 1–4 לבחירה, Enter להמשך.</li></ul>')}
      ${card('🎯', 'h-l4', 'תרגול ממוקד', '<p>במסך הראשי אפשר לבחור סוג שאלה, רמה או את שניהם. התשובות נספרות כרגיל.</p>')}
      ${card('💾', 'h-ok', 'שמירה', '<p>ההתקדמות נשמרת אוטומטית בדפדפן. כדאי לייצא גיבוי מדי פעם, דרך הגדרות ← ייצוא.</p>')}
    </div>
    <section class="card legend"><h2>מצב מילה</h2><div class="chips"><span class="badge seen">נחשפה</span><span class="muted small">טרם נענתה נכון</span></div>
      <div class="chips"><span class="badge learning">נענתה נכון</span><span class="muted small">לפחות פעם אחת</span></div>
      <div class="chips"><span class="badge mastered">בשליטה</span><span class="muted small">נכון לאורך זמן, בבחירה ובהקלדה</span></div></section>`;
  }

  const VIEWS = { home: homeView, placement: placementView, practice: practiceView, words: wordsView, bank: bankView, word: wordView, settings: settingsView, help: helpView };
  function go(view, arg = null) { A.view = view; A.arg = arg; render(); }

  /* ---------- Events ---------- */
  function onClick(e) {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (el.tagName === 'FORM' || act === 'import-file') return;
    switch (act) {
      case 'go': if (el.dataset.from) A.from = el.dataset.from; else if (el.dataset.view !== 'word') A.from = null; A.flash = null; A.importPreview = null; A.confirmReset = false; go(el.dataset.view, el.dataset.arg || null); break;
      case 'back': { const [v, a] = (A.from || 'home').split(':'); A.from = null; go(v, a || null); break; }
      case 'dismiss': A.flash = null; render(); break;
      case 'placement-start': placementStart(); break;
      case 'placement-resume': go('placement'); break;
      case 'placement-skip': logEvent({ id: C.uid(now(), Math.random), t: now(), k: 'placement', theta: C.PARAMS.defaultTheta, skipped: true, n: 0 }); A.session = null; saveSession(); go('home'); break;
      case 'placement-redo': placementStart(); break;
      case 'placement-done': A.session = null; saveSession(); practiceStart(); break;
      case 'practice-start': practiceStart(); break;
      case 'practice-again': practiceStart(A.session && A.session.focus); break;
      case 'practice-resume': go('practice'); break;
      case 'practice-abandon': case 'practice-finish': A.session = null; saveSession(); go('home'); break;
      case 'answer-opt': onOption(Number(el.dataset.i)); break;
      case 'answer-dk': submitAnswer({ r: R.DONT_KNOW }); break;
      case 'self-correct': selfCorrect(); break;
      case 'hint': { const s = A.session; if (s && s.kind === 'practice' && s.phase === 'question') { s.items[s.idx].hintUsed = true; saveSession(); render(); } break; }
      case 'next': next(); break;
      case 'speak': speak(el.dataset.text); break;
      case 'export': doExport(false); break;
      case 'export-copy': doExport(true); break;
      case 'import-text': previewImport(document.getElementById('import-text').value); break;
      case 'import-replace': applyImport('replace'); break;
      case 'import-merge': applyImport('merge'); break;
      case 'import-clear': A.importPreview = null; render(); break;
      case 'undo-import': undoImport(); break;
      case 'reset': A.confirmReset = true; render(); break;
      case 'reset-cancel': A.confirmReset = false; render(); break;
      case 'reset-confirm':
        Object.values(KEYS).forEach(k => Store.remove(k));
        A.events = []; A.session = null; A.settings = { ...C.DEFAULT_SETTINGS }; A.meta = {}; A.confirmReset = false; recompute();
        A.flash = { kind: 'ok', text: 'כל הנתונים נמחקו.' }; go('home'); break;
      case 'retry-save': saveProgress() && saveSettings() && saveSession(); render(); break;
      case 'snooze-backup': A.meta.snoozeUntil = now(); saveMeta(); render(); break;
    }
  }
  function onSubmit(e) {
    const f = e.target.closest('form[data-act]'); if (!f) return;
    e.preventDefault();
    if (f.dataset.act === 'answer-typed') onTyped(f.elements.ans.value);
    if (f.dataset.act === 'focus-start') {
      const focus = { type: f.elements.type.value || null, level: f.elements.level.value ? Number(f.elements.level.value) : null };
      if (!focus.type && !focus.level) { document.getElementById('focus-err').textContent = 'בחר סוג שאלה, רמה או את שניהם.'; return; }
      if (!C.focusPoolSize(A.bank.words, focus)) { document.getElementById('focus-err').textContent = 'אין במאגר מילים לשילוב הזה. נסה רמה אחרת.'; return; }
      A.meta.focus = focus; saveMeta();
      practiceStart(focus);
    }
    if (f.dataset.act === 'save-settings') {
      const fd = f.elements;
      const cand = { sessionLength: Number(fd.sessionLength.value), newPerSession: Number(fd.newPerSession.value), backupReminderDays: Number(fd.backupReminderDays.value), theme: fd.theme.value, tts: fd.tts.checked };
      const bad = [];
      if (!Number.isInteger(cand.sessionLength) || cand.sessionLength < 5 || cand.sessionLength > 40) bad.push('מספר שאלות במפגש: מספר שלם בין 5 ל-40.');
      if (!Number.isInteger(cand.newPerSession) || cand.newPerSession < 0 || cand.newPerSession > 15) bad.push('מילים חדשות: מספר שלם בין 0 ל-15.');
      if (!Number.isInteger(cand.backupReminderDays) || cand.backupReminderDays < 0 || cand.backupReminderDays > 60) bad.push('תזכורת גיבוי: מספר שלם בין 0 ל-60.');
      if (bad.length) { document.getElementById('serr').textContent = bad.join(' '); return; }
      A.settings = C.sanitizeSettings(cand);
      A.flash = saveSettings() ? { kind: 'ok', text: 'ההגדרות נשמרו.' } : null;
      render();
    }
  }
  function onChange(e) {
    const el = e.target;
    if (el.matches('input[data-act="import-file"]') && el.files && el.files[0]) {
      const file = el.files[0];
      if (file.size > 20 * 1024 * 1024) { A.importPreview = { ok: false, errors: ['הקובץ גדול מדי.'], warnings: [] }; return render(); }
      const rd = new FileReader();
      rd.onload = () => previewImport(String(rd.result));
      rd.onerror = () => { A.importPreview = { ok: false, errors: ['קריאת הקובץ נכשלה.'], warnings: [] }; render(); };
      rd.readAsText(file);
    }
  }
  function onKey(e) {
    if (e.target.matches('input, textarea, select')) return;
    const s = A.session; if (!s || !['placement', 'practice'].includes(A.view)) return;
    if (s.phase === 'question' && /^[1-9]$/.test(e.key)) { onOption(Number(e.key) - 1); e.preventDefault(); }
  }
  function speak(text) {
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /^en(-|_)US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }
  function onStorage(e) {
    if (!e.key || !Object.values(KEYS).includes(e.key)) return;
    loadAll();
    A.flash = { kind: 'info', text: 'הנתונים עודכנו מלשונית אחרת של האתר.' };
    if (A.view === 'practice' && (!A.session || A.session.kind !== 'practice')) A.view = 'home';
    render();
  }

  function init() {
    let raw = null, parseErr = null;
    try { raw = JSON.parse(document.getElementById('word-bank').textContent); } catch (e) { parseErr = e; }
    const vb = C.validateBank(raw);
    if (parseErr) vb.errors.unshift('לא ניתן היה לקרוא את מאגר המילים.');
    A.bank = { ...vb, byId: Object.fromEntries(vb.words.map(w => [w.id, w])) };
    loadAll();
    if (A.session && A.session.kind === 'placement' && !A.session.result) A.view = 'home';
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKey);
    window.addEventListener('storage', onStorage);
    // ask the browser to keep this site's storage (best effort; ignored where unsupported)
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
    render();
  }

  return { init, A, makeQuestion, render, go, KEYS };
})();

window.AMV = { Core, App };
document.addEventListener('DOMContentLoaded', App.init);

</script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
