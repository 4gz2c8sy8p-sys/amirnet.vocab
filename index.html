itigate נפוץ עם נזק וסיכון."}],"practice":{"cloze":[{"s":"Engineers are developing new methods to ___ the damage caused by earthquakes.","a":"mitigate","d":["exacerbate","emphasize","substantiate"],"why":"המהנדסים רוצים לצמצם את הנזק. exacerbate פירושו ההפך: להחריף."}],"family":{"s":"Climate ___ requires close cooperation between countries.","a":"mitigation","o":["mitigation","mitigate","mitigating"],"why":"כאן נדרש שם עצם, נושא המשפט: climate mitigation."},"passage":{"text":"Coastal cities cannot stop sea levels from rising, but they can mitigate the consequences. Building sea walls, restoring wetlands and moving important infrastructure away from the shore will not eliminate the danger, yet together these measures can significantly reduce the damage caused by future floods.","q":"In the passage, the word \"mitigate\" is closest in meaning to:","o":["lessen","eliminate","predict","ignore"],"a":0,"why":"הקטע אומר שהצעדים לא יבטלו את הסכנה (will not eliminate) אבל יפחיתו את הנזק. לכן mitigate = lessen."}}},{"id":"w0012","word":"plausible","level":3,"pos":["adjective"],"he":"סביר, מתקבל על הדעת","accept":["סביר","סבירה","מתקבל על הדעת","מתקבלת על הדעת","הגיוני","הגיונית","אפשרי וסביר"],"senses":[{"he":"נראה הגיוני ועשוי להיות נכון, גם אם לא הוכח"}],"usage":"נאמר בעיקר על הסבר, טענה או תרחיש. מבנה נפוץ: it is plausible that ...","examples":[{"en":"The scientists offered a plausible explanation for the strange results.","he":"המדענים הציעו הסבר סביר לתוצאות המוזרות."},{"en":"It is plausible that the virus spread through contaminated water.","he":"סביר שהנגיף התפשט דרך מים מזוהמים."}],"collocations":["a plausible explanation","a plausible scenario","a plausible argument","perfectly plausible","highly plausible"],"patterns":["it is plausible that ..."],"family":[{"word":"implausible","pos":"adjective","he":"לא סביר"},{"word":"plausibility","pos":"noun","he":"סבירות"},{"word":"plausibly","pos":"adverb","he":"באופן סביר"}],"synonyms":["reasonable","credible","believable"],"antonyms":["implausible","unlikely"],"confusables":[{"word":"possible","he":"אפשרי","note":"possible = ייתכן, גם אם לא סביר; plausible = נשמע הגיוני ומתקבל על הדעת."}],"practice":{"cloze":[{"s":"The investigators rejected his story because it was simply not ___.","a":"plausible","d":["reluctant","inevitable","ubiquitous"],"why":"החוקרים דחו את הסיפור כי הוא לא היה סביר."}],"family":{"s":"Critics questioned the ___ of the official explanation.","a":"plausibility","o":["plausibility","plausible","plausibly"],"why":"אחרי the נדרש שם עצם: plausibility."},"restatement":{"s":"It is plausible that the delay was caused by a technical fault.","o":["A technical fault is a reasonable explanation for the delay.","The technical fault was caused by the delay.","The delay could not have been caused by a technical fault.","It has been proven that a technical fault caused the delay."],"a":0,"why":"plausible = סביר. האפשרות הרביעית מוגזמת (הוכח), השלישית הפוכה, והשנייה הופכת את הסיבה והתוצאה."}}},{"id":"w0013","word":"scrutiny","level":3,"pos":["noun"],"he":"בחינה מדוקדקת, ביקורת","accept":["בחינה מדוקדקת","בדיקה מדוקדקת","בחינה קפדנית","בדיקה קפדנית","בדיקה יסודית","ביקורת","בחינה","פיקוח"],"senses":[{"he":"בחינה קפדנית וביקורתית, לעיתים ציבורית"}],"usage":"שם עצם לא ספיר. מבנים נפוצים: come under scrutiny (לעמוד לבחינה מדוקדקת), be subject to scrutiny. הפועל: scrutinize.","examples":[{"en":"The government's spending plans have come under close scrutiny.","he":"תוכניות ההוצאה של הממשלה עומדות לבחינה מדוקדקת."},{"en":"The new policy will not survive public scrutiny.","he":"המדיניות החדשה לא תעמוד בביקורת הציבורית."}],"collocations":["close scrutiny","careful scrutiny","intense scrutiny","public scrutiny","come under scrutiny","withstand scrutiny"],"patterns":["come under scrutiny","be subject to scrutiny"],"family":[{"word":"scrutinize","pos":"verb","he":"לבחון בקפידה"}],"synonyms":["examination","inspection"],"traps":["scrutiny הוא שם עצם. הפועל הוא scrutinize: They scrutinized the data."],"practice":{"cloze":[{"s":"After the scandal, every decision of the board came under intense ___.","a":"scrutiny","d":["decline","emphasis","ambiguity"],"why":"come under scrutiny = לעמוד לבחינה מדוקדקת."}],"family":{"s":"The auditors will ___ every transaction made last year.","a":"scrutinize","o":["scrutinize","scrutiny","scrutinizing"],"why":"אחרי will נדרש פועל בצורת הבסיס: scrutinize."}}},{"id":"w0014","word":"substantiate","level":3,"pos":["verb"],"he":"לבסס, לאשש (בראיות)","accept":["לבסס","לאשש","להוכיח","ביסס","אישש","הוכיח","לגבות בראיות","ביסוס"],"senses":[{"he":"לספק ראיות שמראות שטענה נכונה"}],"usage":"נפוץ בהקשר משפטי ומחקרי, ולעיתים קרובות בשלילה: could not substantiate. שם התואר unsubstantiated = לא מבוסס.","examples":[{"en":"The journalist could not substantiate her claims with documents.","he":"העיתונאית לא הצליחה לבסס את טענותיה במסמכים."},{"en":"Further research is needed to substantiate these findings.","he":"נדרש מחקר נוסף כדי לאשש את הממצאים האלה."}],"collocations":["substantiate a claim","substantiate an allegation","fully substantiated","unsubstantiated rumors"],"family":[{"word":"unsubstantiated","pos":"adjective","he":"לא מבוסס"},{"word":"substantiation","pos":"noun","he":"ביסוס"},{"word":"substance","pos":"noun","he":"חומר; ממשות, מהות"}],"synonyms":["prove","support","verify"],"antonyms":["refute","disprove"],"confusables":[{"word":"corroborate","he":"לאשש באמצעות ראיה נוספת","note":"corroborate מחזק טענה קיימת בראיה נוספת ובלתי תלויה; substantiate מספק ראיות לטענה."},{"word":"substantial","he":"ניכר, משמעותי","note":"שם תואר מאותה משפחה, במשמעות שונה לגמרי."}],"practice":{"cloze":[{"s":"The allegations against the mayor were never ___, so the case was closed.","a":"substantiated","d":["mitigated","emphasized","deteriorated"],"why":"התיק נסגר כי הטענות לא בוססו בראיות."}],"family":{"s":"The article was full of ___ rumors that no one could prove.","a":"unsubstantiated","o":["unsubstantiated","substantiate","substantiation"],"why":"לפני rumors נדרש שם תואר, ובמשמעות \"לא מבוסס\": unsubstantiated."}}},{"id":"w0015","word":"implicit","level":3,"pos":["adjective"],"he":"מרומז, משתמע; מוחלט (implicit trust)","accept":["מרומז","מרומזת","משתמע","משתמעת","לא מפורש","סמוי","מובלע","מוחלט"],"senses":[{"he":"משתמע, לא נאמר במפורש"},{"he":"מוחלט, ללא סייג (implicit trust, implicit faith)"}],"usage":"המשמעות הנפוצה בטקסטים עיוניים: משתמע ולא מפורש. מבנה: implicit in something. ההפך: explicit.","examples":[{"en":"There was an implicit threat in his words.","he":"היה איום מרומז בדבריו."},{"en":"The idea is implicit in the author's argument, although she never states it directly.","he":"הרעיון משתמע מהטיעון של הכותבת, אף שהיא אינה אומרת אותו במפורש."}],"collocations":["an implicit assumption","implicit criticism","an implicit threat","implicit in something","implicit trust"],"patterns":["be implicit in something"],"family":[{"word":"implicitly","pos":"adverb","he":"במרומז; באופן מוחלט"},{"word":"imply","pos":"verb","he":"לרמוז"},{"word":"implication","pos":"noun","he":"השלכה; משמעות משתמעת"}],"synonyms":["implied","unstated","tacit"],"antonyms":["explicit"],"confusables":[{"word":"explicit","he":"מפורש","note":"ההפך של implicit."},{"word":"implicate","he":"לקשור למעורבות (בדרך כלל בפשע)","note":"פועל, ולא שם תואר."}],"sources":["AWL (Coxhead, 2000): implicit"],"practice":{"cloze":[{"s":"Although the manager never said so directly, there was an ___ criticism of the team in her remarks.","a":"implicit","d":["explicit","obsolete","eager"],"why":"never said so directly מראה שהביקורת מרומזת. explicit פירושו ההפך: מפורש."}],"distinction":{"s":"The contract must be ___: every obligation has to be written out clearly.","a":"explicit","o":["explicit","implicit","implicated","complicit"],"why":"written out clearly = מפורש, explicit. implicit פירושו משתמע."},"passage":{"text":"The letter from the bank did not say that Mr. Lee's loan request would be rejected. Still, the message was implicit in its tone: it thanked him for his patience, mentioned \"strict criteria\" three times, and suggested that he consider other options.","q":"In the passage, the word \"implicit\" means:","o":["suggested without being stated directly","clearly written","completely false","openly hostile"],"a":0,"why":"המכתב לא אמר את הדבר במפורש (did not say), אבל הטון רמז עליו. לכן implicit = משתמע."}}},{"id":"w0016","word":"ubiquitous","level":4,"pos":["adjective"],"he":"נמצא בכל מקום, נפוץ ביותר","accept":["נמצא בכל מקום","נמצאת בכל מקום","בכל מקום","נוכח בכל מקום","מצוי בכל מקום","נפוץ מאוד","נפוץ ביותר","נפוץ","שכיח מאוד"],"senses":[{"he":"נמצא או נראה כמעט בכל מקום"}],"usage":"מתאר דבר שהפך לנוכח בכל מקום, לעיתים עד שכבר לא שמים לב אליו. נפוץ במבנה become ubiquitous.","examples":[{"en":"Smartphones have become ubiquitous in modern life.","he":"הטלפונים החכמים נמצאים היום בכל מקום בחיים המודרניים."},{"en":"Plastic waste is now ubiquitous, even in the deepest parts of the ocean.","he":"פסולת פלסטיק נמצאת היום בכל מקום, אפילו בחלקים העמוקים ביותר של האוקיינוס."}],"collocations":["become ubiquitous","almost ubiquitous","increasingly ubiquitous","the ubiquitous smartphone"],"family":[{"word":"ubiquity","pos":"noun","he":"נוכחות בכל מקום"}],"synonyms":["pervasive","omnipresent","widespread"],"antonyms":["rare","scarce"],"practice":{"cloze":[{"s":"Security cameras are now so ___ that most people no longer notice them.","a":"ubiquitous","d":["tenuous","reluctant","plausible"],"why":"המצלמות נמצאות בכל מקום, ולכן כבר לא שמים לב אליהן."}],"passage":{"text":"Fifty years ago, a camera was an expensive item that most families used only on special occasions. Today, cameras are ubiquitous: they are built into phones, laptops, cars and even doorbells. As a result, ordinary people now take more photographs in a single day than earlier generations took in a year.","q":"In the passage, the word \"ubiquitous\" is closest in meaning to:","o":["found almost everywhere","extremely expensive","difficult to operate","recently in   const EXPORT_FORMAT = 'amirnet-vocab-progress';
  const DAY = 86400000;
  const MIN = 60000;

  /* ---------- Tunable parameters ---------- */
  const PARAMS = {
    // Scale (0-100). Item difficulty b = levelCenter + type offset (+ optional per-word offset).
    levelCenters: [25, 45, 65, 85],
    logisticScale: 10,          // slope of the response model, in scale points
    prior: { mean: 50, sd: 20 },// placement prior
    defaultTheta: 40,           // start point when the placement test is skipped
    // Placement test
    placementLength: 24,
    placementMaxBankShare: 0.8, // never use more than this share of the bank
    placementMinPerLevel: 2,
    placementTypes: ['mcMeaning', 'mcCloze', 'mcReverse', 'typeHe'],
    // Gradual updates during practice
    K0: 2.0, Kmin: 0.5, Khalf: 30, maxStep: 1.5,
    selfAssessedWeight: 0.5,    // "I was right" counts half
    hintWeight: 0.5,            // a correct answer after a hint counts half
    // Level mix
    mixOffset: 0,               // shift the mix up (+) or down (-) relative to the scale
    // Spaced repetition (Leitner boxes per skill)
    intervalsDays: [0, 1, 2, 4, 7, 14, 30, 60, 120],
    relearnMinutes: 10,
    lapsePenalty: 0.15,         // each past lapse shortens future intervals...
    minIntervalFactor: 0.5,     // ...but never below half
    recallUnlockBox: 1,         // open (typed) questions start after the first successful recognition
    masteredRecog: 4, masteredRecall: 3,
    earlyReviewToleranceMin: 60,
    // Sessions
    problemShare: 0.2,
    backlogFactorNoNew: 2.0,    // if due words >= N*factor, no new words this session
    reaskGap: 3,
    newRepeatGap: 3,
    hardLapses: 2, hardMastery: 0.4,
  };

  /* ---------- Question types ---------- */
  const TYPES = {
    mcMeaning:   { skill: 'recog',  label: 'זיהוי משמעות',          origin: 'original', guess: 0.25, offset: -6 },
    mcReverse:   { skill: 'recog',  label: 'זיהוי המילה באנגלית',     origin: 'original', guess: 0.25, offset: -3 },
    mcCloze:     { skill: 'recog',  label: 'השלמת משפט',             origin: 'amirnet',  guess: 0.25, offset: 0 },
    distinction: { skill: 'recog',  label: 'הבחנה בין מילים דומות',   origin: 'original', guess: 0.25, offset: 4 },
    passage:     { skill: 'recog',  label: 'מילה בתוך קטע',           origin: 'amirnetInspired', guess: 0.25, offset: 2 },
    restatement: { skill: 'recog',  label: 'ניסוח מחדש',             origin: 'amirnet',  guess: 0.25, offset: 6 },
    family:      { skill: 'recog',  label: 'משפחות מילים',           origin: 'original', guess: 0.33, offset: 2 },
    spelling:    { skill: 'recog',  label: 'איות',                   origin: 'original', guess: 0.25, offset: 3 },
    typeHe:      { skill: 'recall', label: 'שליפה: משמעות בעברית',    origin: 'original', guess: 0,    offset: 6 },
    typeEn:      { skill: 'recall', label: 'שליפה: המילה באנגלית',    origin: 'original', guess: 0,    offset: 10 },
    typeCloze:   { skill: 'recall', label: 'השלמת מילה במשפט',        origin: 'original', guess: 0,    offset: 8 },
  };
  const ORIGIN_LABEL = {
    amirnet: 'פורמט בסגנון אמירנט',
    amirnetInspired: 'בהשראת הבנת הנקרא באמירנט',
    original: 'תרגיל מקורי',
  };
  // Result codes
  const R = { WRONG: 0, CORRECT: 1, DONT_KNOW: 2, SELF: 3, HINT: 4 };
  const isRight = r => r === R.CORRECT || r === R.SELF || r === R.HINT;

  /* ---------- Utilities ---------- */
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) { // FNV-1a 32-bit
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);
  }
  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function uid(t, rng) { return t.toString(36) + '-' + Math.floor(rng() * 1e9).toString(36); }

  /* ---------- Bank ---------- */
  function validateBank(raw) {
    const errors = [], words = [];
    if (!raw || !Array.isArray(raw.batches)) return { errors: ['מבנה המאגר אינו תקין (חסר batches).'], words, bankId: null, version: 0 };
    const ids = new Set(), heads = new Set();
    raw.batches.forEach(b => (b.words || []).forEach(w => {
      const e = [];
      if (!w || typeof w.id !== 'string' || !w.id) e.push('מזהה חסר');
      if (typeof w.word !== 'string' || !w.word.trim()) e.push('מילה חסרה');
      if (![1, 2, 3, 4].includes(w.level)) e.push('רמה לא תקינה');
      if (!Array.isArray(w.pos) || !w.pos.length) e.push('חלק דיבר חסר');
      if (typeof w.he !== 'string' || !w.he) e.push('תרגום חסר');
      if (!Array.isArray(w.accept) || !w.accept.length) e.push('רשימת תשובות מקובלות חסרה');
      if (!Array.isArray(w.senses) || !w.senses.length) e.push('משמעויות חסרות');
      if (typeof w.usage !== 'string' || !w.usage) e.push('הסבר שימוש חסר');
      if (!Array.isArray(w.examples) || w.examples.length < 2 || w.examples.some(x => !x.en || !x.he)) e.push('נדרשות לפחות שתי דוגמאות עם תרגום');
      if (!Array.isArray(w.collocations) || !w.collocations.length) e.push('צירופים חסרים');
      if (!w.practice || !Array.isArray(w.practice.cloze) || !w.practice.cloze.length) e.push('חסר משפט להשלמה');
      if (w && ids.has(w.id)) e.push('מזהה כפול');
      if (w && typeof w.word === 'string' && heads.has(w.word.toLowerCase())) e.push('מילה כפולה');
      if (e.length) { errors.push(`${(w && (w.word || w.id)) || '?'}: ${e.join(', ')}`); return; }
      ids.add(w.id); heads.add(w.word.toLowerCase());
      words.push(w);
    }));
    return { errors, words, bankId: raw.bankId || 'unknown', version: raw.version || 0 };
  }

  /* ---------- Response model and scale ---------- */
  function itemDifficulty(word, type) {
    return PARAMS.levelCenters[word.level - 1] + TYPES[type].offset + (word.difficultyOffset || 0);
  }
  function pCorrect(theta, b, g) {
    return g + (1 - g) / (1 + Math.exp(-(theta - b) / PARAMS.logisticScale));
  }
  // Placement: maximum a-posteriori estimate on a 0..100 grid with a normal prior.
  // "Don't know" answers are scored as wrong with no guessing component.
  function placementEstimate(responses) {
    let best = PARAMS.prior.mean, bestLL = -Infinity;
    for (let th = 0; th <= 100; th += 0.5) {
      let ll = -((th - PARAMS.prior.mean) ** 2) / (2 * PARAMS.prior.sd ** 2);
      for (const r of responses) {
        const g = r.r === R.DONT_KNOW ? 0 : TYPES[r.q].guess;
        const p = clamp(pCorrect(th, r.b, g), 1e-6, 1 - 1e-6);
        const o = isRight(r.r) ? 1 : 0;
        ll += o ? Math.log(p) : Math.log(1 - p);
      }
      if (ll > bestLL) { bestLL = ll; best = th; }
    }
    return Math.round(best * 10) / 10;
  }
  function stepK(n) { return Math.max(PARAMS.Kmin, PARAMS.K0 / Math.sqrt(1 + n / PARAMS.Khalf)); }
  function thetaDelta(theta, b, type, r, n) {
    let g = TYPES[type].guess, o, w = 1;
    if (r === R.CORRECT) o = 1;
    else if (r === R.SELF) { o = 1; w = PARAMS.selfAssessedWeight; }
    else if (r === R.HINT) { o = 1; w = PARAMS.hintWeight; }
    else if (r === R.DONT_KNOW) { o = 0; g = 0; }
    else o = 0;
    const p = pCorrect(theta, b, g);
    return clamp(stepK(n) * w * (o - p), -PARAMS.maxStep, PARAMS.maxStep);
  }

  /* ---------- Level mix ---------- */
  // Linear interpolation between the two level centres around the scale point.
  function levelMix(theta) {
    const c = PARAMS.levelCenters, x = theta + PARAMS.mixOffset;
    const mix = { 1: 0, 2: 0, 3: 0, 4: 0 };
    if (x <= c[0]) { mix[1] = 1; return mix; }
    if (x >= c[3]) { mix[4] = 1; return mix; }
    for (let i = 0; i < 3; i++) {
      if (x >= c[i] && x < c[i + 1]) {
        const f = (x - c[i]) / (c[i + 1] - c[i]);
        mix[i + 1] = 1 - f; mix[i + 2] = f; return mix;
      }
    }
    return mix;
  }

  /* ---------- Per-word state and spaced repetition ---------- */
  function newWordState() {
    return {
      exposures: 0, correct: 0, wrong: 0, dontKnow: 0, self: 0, lapses: 0,
      firstSeen: null, lastSeen: null, last: [],
      recog: { box: 0, due: null }, recall: { box: 0, due: null },
      types: {},  // type -> {c, w}
    };
  }
  function intervalMs(box, lapses) {
    const days = PARAMS.intervalsDays[clamp(box, 0, PARAMS.intervalsDays.length - 1)];
    const factor = Math.max(PARAMS.minIntervalFactor, 1 - PARAMS.lapsePenalty * lapses);
    return days * DAY * factor;
  }
  function recallUnlocked(ws) { return ws.recall.due !== null; }
  function wordDue(ws) {
    let d = ws.recog.due ?? Infinity;
    if (recallUnlocked(ws)) d = Math.min(d, ws.recall.due);
    return d;
  }
  function recentWrong(ws) { return ws.last.slice(-5).filter(r => r === R.WRONG || r === R.DONT_KNOW).length; }
  function mastery(ws) {
    if (!ws || !ws.exposures) return 0;
    const m = 0.55 * Math.min(ws.recog.box, 6) / 6 + 0.45 * Math.min(ws.recall.box, 5) / 5 - 0.08 * recentWrong(ws);
    return clamp(m, 0, 1);
  }
  function isMastered(ws) {
    return !!ws && ws.recog.box >= PARAMS.masteredRecog && ws.recall.box >= PARAMS.masteredRecall
      && (ws.last[ws.last.length - 1] === R.CORRECT);
  }
  // new: never shown; seen: shown, never answered correctly; learning: answered correctly at least once; mastered: over time
  function statusOf(ws) {
    if (!ws || !ws.exposures) return 'new';
    if (isMastered(ws)) return 'mastered';
    if (ws.correct + ws.self > 0) return 'learning';
    return 'seen';
  }
  function isHard(ws) {
    return !!ws && ws.exposures > 0 && (ws.lapses >= PARAMS.hardLapses || (ws.wrong + ws.dontKnow > 0 && mastery(ws) < PARAMS.hardMastery));
  }

  // Apply one answer to the word's history. `counts` = whether this answer may move the schedule
  // (re-asks inside the same session do not).
  function applyToWord(ws, ev, counts) {
    const t = ev.t, skill = TYPES[ev.q].skill, s = ws[skill];
    const knewBefore = ws.correct + ws.self > 0;
    ws.exposures++; if (ws.firstSeen === null) ws.firstSeen = t; ws.lastSeen = t;
    ws.last.push(ev.r); if (ws.last.length > 8) ws.last.shift();
    const ts = ws.types[ev.q] || (ws.types[ev.q] = { c: 0, w: 0 });
    if (isRight(ev.r)) ts.c++; else ts.w++;
    if (ev.r === R.CORRECT) ws.correct++;
    else if (ev.r === R.SELF || ev.r === R.HINT) ws.self++;
    else if (ev.r === R.DONT_KNOW) ws.dontKnow++;
    else ws.wrong++;
    if (!counts) return;
    if (s.due === null) s.due = t; // recall skill becomes active on first use
    if (ev.r === R.CORRECT) {
      const early = s.due - t > PARAMS.earlyReviewToleranceMin * MIN;
      if (!early) { s.box = Math.min(s.box + 1, PARAMS.intervalsDays.length - 1); s.due = t + intervalMs(s.box, ws.lapses); }
    } else if (ev.r === R.SELF || ev.r === R.HINT) {
      s.due = t + Math.max(DAY, intervalMs(s.box, ws.lapses) / 2);
    } else {
      if (knewBefore) ws.lapses++; // a lapse = failing a word that was already answered correctly
      s.box = Math.floor(s.box / 2);
      s.due = t + PARAMS.relearnMinutes * MIN;
    }
    if (skill === 'recog' && ws.recog.box >= PARAMS.recallUnlockBox && ws.recall.due === null) ws.recall.due = t + DAY;
  }

  /* ---------- Event log replay (single source of truth) ---------- */
  function emptyState() {
    return { theta: null, placement: null, n: 0, words: {}, history: [], answers: 0, unknown: 0, typeTotals: {}, recent: [] };
  }
  function applyEvent(state, ev, bankById) {
    if (ev.k === 'placement') {
      state.theta = ev.theta; state.placement = { t: ev.t, theta: ev.theta, skipped: !!ev.skipped, n: ev.n || 0 };
      state.n = 0; state.history.push({ t: ev.t, theta: ev.theta });
      return;
    }
    const word = bankById[ev.w];
    if (!word) { state.unknown++; return; }
    const ws = state.words[ev.w] || (state.words[ev.w] = newWordState());
    applyToWord(ws, ev, ev.m === 'p' || ev.f);
    state.answers++;
    const tt = state.typeTotals[ev.q] || (state.typeTotals[ev.q] = { c: 0, w: 0 });
    if (isRight(ev.r)) tt.c++; else tt.w++;
    state.recent.push({ q: ev.q, r: ev.r }); if (state.recent.length > 100) state.recent.shift();
    if (ev.m === 's' && ev.f && state.theta !== null) {
      const d = thetaDelta(state.theta, itemDifficulty(word, ev.q), ev.q, ev.r, state.n);
      state.theta = clamp(Math.round((state.theta + d) * 100) / 100, 0, 100);
      state.n++;
      state.history.push({ t: ev.t, theta: state.theta });
    }
  }
  function sortEvents(events) {
    return events.slice().sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  }
  function replay(events, bankById) {
    const st = emptyState();
    for (const ev of sortEvents(events)) applyEvent(st, ev, bankById);
    return st;
  }

  /* ---------- Placement test ---------- */
  function placementLength(bankSize) {
    return Math.max(0, Math.min(PARAMS.placementLength, Math.floor(bankSize * PARAMS.placementMaxBankShare)));
  }
  // Next placement item: closest difficulty to the current estimate, while guaranteeing coverage of every level.
  function nextPlacementItem(words, asked, rng) {
    const total = placementLength(words.length);
    if (asked.length >= total) return null;
    const used = new Set(asked.map(a => a.w));
    const type = PARAMS.placementTypes[asked.length % PARAMS.placementTypes.length];
    const est = placementEstimate(asked);
    const remaining = total - asked.length;
    const perLevel = { 1: 0, 2: 0, 3: 0, 4: 0 };
    asked.forEach(a => perLevel[a.level]++);
    const avail = l => words.some(w => w.level === l && !used.has(w.id));
    const missing = [1, 2, 3, 4].filter(l => avail(l) && perLevel[l] < PARAMS.placementMinPerLevel);
    const need = missing.reduce((s, l) => s + (PARAMS.placementMinPerLevel - perLevel[l]), 0);
    let pool = words.filter(w => !used.has(w.id));
    if (need >= remaining && missing.length) pool = pool.filter(w => missing.includes(w.level));
    pool = shuffle(pool, rng);
    pool.sort((a, b) => Math.abs(itemDifficulty(a, type) - est) - Math.abs(itemDifficulty(b, type) - est));
    const w = pool[0];
    return w ? { w: w.id, q: type, level: w.level, b: itemDifficulty(w, type) } : null;
  }

  /* ---------- Spelling distractors ---------- */
  // Plausible misspellings built from common English spelling traps (double letters, unstressed
  // vowels, -ant/-ent, -able/-ible, ie/ei, c/s). Never returns the word itself.
  function misspellings(word) {
    const w = word.toLowerCase(), groups = [[], [], []]; // most plausible first
    const add = (g, x) => { if (x && x !== w && /^[a-z-]+$/.test(x) && !groups.some(gr => gr.includes(x))) groups[g].push(x); };
    for (let i = 1; i < w.length; i++) if (w[i] === w[i - 1] && !'aeiou'.includes(w[i])) add(0, w.slice(0, i) + w.slice(i + 1)); // drop a double
    const swaps = [['ent', 'ant'], ['ant', 'ent'], ['ence', 'ance'], ['ance', 'ence'], ['able', 'ible'], ['ible', 'able'], ['ie', 'ei'], ['ei', 'ie'], ['ous', 'ious'], ['ious', 'ous'], ['ph', 'f'], ['tion', 'sion'], ['sc', 's'], ['ce', 'se']];
    for (const [x, y] of swaps) { const i = w.lastIndexOf(x); if (i > 0) add(0, w.slice(0, i) + y + w.slice(i + x.length)); }
    for (let i = 2; i < w.length - 1; i++) if ('aeiou'.includes(w[i]) && 'aeiou'.includes(w[i - 1])) add(1, w.slice(0, i) + w.slice(i + 1)); // drop one of two vowels
    const vowelSwap = { a: 'e', e: 'i', i: 'e', o: 'u', u: 'o' };
    for (let i = 2; i < w.length - 1; i++) if (vowelSwap[w[i]] && !'aeiou'.includes(w[i - 1]) && !'aeiou'.includes(w[i + 1])) add(1, w.slice(0, i) + vowelSwap[w[i]] + w.slice(i + 1));
    for (let i = 1; i < w.length - 3; i++) if ('lrstcmnpfg'.includes(w[i]) && 'aeiou'.includes(w[i - 1]) && 'aeiou'.includes(w[i + 1]) && w[i] !== w[i - 1]) add(2, w.slice(0, i + 1) + w[i] + w.slice(i + 1)); // double a single
    return groups.flat();
  }

  /* ---------- Choosing the practice format ---------- */
  function hasData(word, type) {
    const p = word.practice || {};
    if (type === 'distinction') return !!p.distinction;
    if (type === 'passage') return !!p.passage;
    if (type === 'restatement') return !!p.restatement;
    if (type === 'family') return !!p.family;
    if (type === 'spelling') return misspellings(word.word).length >= 3;
    return true;
  }
  function pickWeighted(cands, rng) {
    const tot = cands.reduce((s, c) => s + c[1], 0);
    let x = rng() * tot;
    for (const c of cands) { x -= c[1]; if (x <= 0) return c[0]; }
    return cands[cands.length - 1][0];
  }
  function chooseType(word, ws, theta, rng, opts = {}) {
    const avoid = opts.avoid || null;
    let cands;
    const th = theta ?? PARAMS.defaultTheta;
    if (!ws || !ws.exposures || opts.recogOnly && (!ws || ws.recog.box < 2)) {
      cands = [['mcMeaning', 2], ['mcReverse', 1], ['mcCloze', 2], ['spelling', 1]];
    } else {
      const rd = ws.recog.due ?? Infinity;
      // recall when it is due first; when both are due, alternate at random so formats stay varied
      const recallTurn = !opts.recogOnly && recallUnlocked(ws) && (ws.recall.due < rd - 3600000 || (ws.recall.due <= rd + 3600000 && rng() < 0.5));
      if (recallTurn) {
        const b = ws.recall.box;
        cands = b < 1 ? [['typeHe', 1.5], ['typeEn', 1], ['typeCloze', 1.2]] : [['typeHe', 1], ['typeEn', 1 + b / 2], ['typeCloze', 1 + b / 2]];
      } else if (ws.recog.box < 2) {
        cands = [['mcMeaning', 1], ['mcReverse', 1], ['mcCloze', 2], ['spelling', 1], ['distinction', 1], ['family', 1]];
      } else {
        const hi = th / 50; // harder formats get more weight as the scale rises
        cands = [['mcCloze', 2], ['distinction', 1.5], ['family', 1], ['spelling', 1], ['passage', 0.7 + hi], ['restatement', 0.5 + hi], ['mcReverse', 0.5]];
      }
    }
    cands = cands.filter(c => hasData(word, c[0]));
    if (avoid && cands.length > 1) cands = cands.filter(c => c[0] !== avoid);
    // prefer formats this word has caused difficulty in (spec: track and revisit weak question types)
    if (ws && ws.types) cands = cands.map(([t, w]) => [t, w * (ws.types[t] && ws.types[t].w > ws.types[t].c ? 1.5 : 1)]);
    return pickWeighted(cands, rng);
  }

  /* ---------- Session composition ---------- */
  function buildSession(words, state, settings, t, rng) {
    const N = settings.sessionLength;
    const theta = state.theta ?? PARAMS.defaultTheta;
    const W = id => state.words[id];
    const exposed = words.filter(w => W(w.id) && W(w.id).exposures > 0);
    const unseen = words.filter(w => !W(w.id) || !W(w.id).exposures);
    const due = exposed.filter(w => wordDue(W(w.id)) <= t)
      .sort((a, b) => (wordDue(W(a.id)) - wordDue(W(b.id))) || (W(b.id).lapses - W(a.id).lapses));
    const dueSet = new Set(due.map(w => w.id));
    const problem = exposed.filter(w => !dueSet.has(w.id) && isHard(W(w.id)))
      .sort((a, b) => mastery(W(a.id)) - mastery(W(b.id)));
    const chosen = [], used = new Set();
    const add = (w, kind) => { if (!used.has(w.id) && chosen.length < N) { used.add(w.id); chosen.push({ w: w.id, kind }); } };

    const newCap = due.length >= N * PARAMS.backlogFactorNoNew ? 0 : Math.min(settings.newPerSession, unseen.length);
    const problemSlots = Math.min(problem.length, Math.round(N * PARAMS.problemShare));
    const reviewSlots = Math.max(0, N - newCap - problemSlots);
    due.slice(0, reviewSlots).forEach(w => add(w, 'review'));
    problem.slice(0, problemSlots).forEach(w => add(w, 'problem'));
    const newWords = pickNewWords(unseen, theta, newCap, rng);
    newWords.forEach(w => add(w, 'new'));
    // remaining due words, then early reinforcement (soonest due first, includes mastered words)
    due.forEach(w => add(w, 'review'));
    exposed.filter(w => !used.has(w.id)).sort((a, b) => wordDue(W(a.id)) - wordDue(W(b.id))).forEach(w => add(w, 'extra'));
    // if the bank still has room (e.g. first sessions), add more new words
    if (chosen.length < N) pickNewWords(unseen.filter(w => !used.has(w.id)), theta, N - chosen.length, rng).forEach(w => add(w, 'new'));

    // every new word is asked twice; keep the total within the session length
    while (chosen.length + chosen.filter(c => c.kind === 'new').length > N && chosen.length > 1) chosen.pop();
    const byId = Object.fromEntries(words.map(w => [w.id, w]));
